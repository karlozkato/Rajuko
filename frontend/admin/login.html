<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Página privada: fuera de buscadores y sin enviar la URL de origen a otros sitios -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Acceso administrador · RAJUKO</title>
  <link rel="icon" type="image/png" href="../images/isotipo.png?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>

<body class="admin pagina-login">

  <!-- Iconos usados en esta página (mismo estilo de trazo que el panel) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-ojo" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-ojo-cerrado" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.7C3.9 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-flecha" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>

  <!-- Píxeles sueltos: el isotipo de RAJUKO se deshace en píxeles; aquí es solo un guiño -->
  <div class="pixeles" aria-hidden="true">
    <span style="--x:8%;--y:18%;--t:8px;--c:var(--rosa);--o:.5"></span>
    <span style="--x:14%;--y:26%;--t:5px;--c:var(--cian);--o:.45"></span>
    <span style="--x:11%;--y:70%;--t:6px;--c:var(--rosa);--o:.3"></span>
    <span style="--x:86%;--y:14%;--t:6px;--c:var(--cian);--o:.4"></span>
    <span style="--x:91%;--y:22%;--t:9px;--c:var(--rosa);--o:.45"></span>
    <span style="--x:88%;--y:78%;--t:5px;--c:var(--cian);--o:.35"></span>
    <span style="--x:80%;--y:84%;--t:8px;--c:var(--rosa);--o:.3"></span>
  </div>

  <main class="login">
    <div class="login-card">
      <div class="login-marca">
        <img src="../images/isotipo.png" alt="" width="56" height="56">
        <span class="login-nombre">RAJUKO</span>
      </div>

      <p class="sobretitulo">Acceso privado</p>
      <h1 class="login-titulo">Panel de administración</h1>
      <p class="login-sub">Solo para el equipo de RAJUKO.</p>

      <!-- Avisos: la nota (informativa) y el error (se anuncia a lectores de pantalla) -->
      <div id="login-nota" class="aviso aviso-info" role="status" hidden></div>
      <div id="login-error" class="aviso aviso-error" role="alert" hidden></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="login-email">Correo electrónico</label>
          <input id="login-email" name="email" type="email" autocomplete="username" maxlength="150" required autofocus>
        </div>

        <div class="campo">
          <label for="login-password">Contraseña</label>
          <div class="campo-password">
            <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
            <button type="button" id="login-ojo" class="ojo" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="ico ico-ojo" aria-hidden="true" focusable="false"><use href="#i-ojo"/></svg>
              <svg class="ico ico-ojo-cerrado" aria-hidden="true" focusable="false"><use href="#i-ojo-cerrado"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-boton" class="btn-primario btn-bloque">
          <span>Entrar</span>
        </button>
      </form>

      <a class="enlace-flecha enlace-volver" href="../index.html">
        <span>Volver al sitio</span>
        <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-flecha"/></svg>
      </a>
    </div>
  </main>

  <script src="../config.js"></script>
  <script src="../api.js"></script>
  <script src="sesion.js"></script>
  <script src="login.js"></script>
</body>

</html>
