<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Página privada: fuera de buscadores y sin enviar la URL de origen a otros sitios -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Panel · RAJUKO Admin</title>
  <link rel="icon" type="image/png" href="../images/isotipo.png?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>

<!-- "verificando": el panel permanece OCULTO hasta que el servidor confirme la sesión (panel.js) -->
<body class="admin verificando">

  <!-- Sprite de iconos: un solo estilo (trazo de 1.6 px, esquinas redondeadas) para todo el panel -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-caja" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
    <symbol id="i-sobre" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
    <symbol id="i-externo" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-salir" viewBox="0 0 24 24"><path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-refrescar" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v4h4M4 13a8 8 0 0 0 14.9 3M20 19v-4h-4"/></symbol>
    <symbol id="i-flecha" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-editar" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
    <symbol id="i-papelera" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="i-ojo" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-ojo-tachado" viewBox="0 0 24 24"><path d="M17.9 17.9A10.5 10.5 0 0 1 12 19C5.6 19 2 12 2 12a18 18 0 0 1 5.1-5.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M3 3l18 18"/></symbol>
    <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-buscar" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-imagen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></symbol>
  </svg>

  <!-- Pantalla de verificación de sesión (se oculta cuando el servidor confirma el acceso) -->
  <div class="pantalla-carga" id="pantalla-carga" role="status">
    <img src="../images/isotipo.png" alt="" width="56" height="56">
    <p id="carga-texto">Verificando sesión…</p>
    <button type="button" id="carga-reintentar" class="btn-fantasma" hidden>Reintentar</button>
  </div>

  <div class="app">
    <div class="velo" id="velo" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="Navegación del panel">
      <a class="marca" href="#/">
        <img src="../images/isotipo.png" alt="" width="34" height="34">
        <span class="marca-nombre">RAJUKO</span>
        <span class="marca-etiqueta">Admin</span>
      </a>

      <nav class="menu" aria-label="Secciones">
        <a class="menu-link" href="#/" data-ruta="/">
          <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-panel"/></svg>
          <span>Panel</span>
        </a>
        <a class="menu-link" href="#/productos" data-ruta="/productos">
          <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-caja"/></svg>
          <span>Productos</span>
        </a>
        <a class="menu-link" href="#/mensajes" data-ruta="/mensajes">
          <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-sobre"/></svg>
          <span>Mensajes</span>
          <span class="menu-contador" id="contador-mensajes" hidden>0</span>
        </a>
      </nav>

      <div class="sidebar-pie">
        <a class="menu-link menu-link-suave" href="../index.html" target="_blank" rel="noopener">
          <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-externo"/></svg>
          <span>Ver el sitio</span>
        </a>
      </div>
    </aside>

    <div class="contenido">
      <header class="topbar">
        <button type="button" class="btn-icono btn-menu" id="btn-menu" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
          <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg>
        </button>
        <p class="topbar-seccion"><span class="topbar-prefijo">RAJUKO /</span> <span id="seccion-actual">Panel</span></p>

        <div class="topbar-usuario">
          <div class="usuario-datos">
            <span class="usuario-email" id="admin-email"></span>
            <span class="usuario-sesion" id="sesion-hasta"></span>
          </div>
          <span class="avatar" id="admin-inicial" aria-hidden="true"></span>
          <button type="button" class="btn-icono" id="btn-salir" aria-label="Cerrar sesión" title="Cerrar sesión">
            <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-salir"/></svg>
          </button>
        </div>
      </header>

      <main class="vista" id="vista" tabindex="-1"></main>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../api.js"></script>
  <script src="sesion.js"></script>
  <script src="dom.js"></script>
  <script src="ui.js"></script>
  <script src="dashboard.js"></script>
  <script src="panel.js"></script>
</body>

</html>
