<body>
  <header>
    <div class="header-top">
      <div class="header-side"></div>

      <a href="index.html#inicio" class="brand" aria-label="RAJUKO — Inicio">
        <img src="./images/isotipo.png" alt="" class="logo">
        <span class="brand-name">RAJUKO</span>
      </a>

      <div class="header-side header-icons">

             Se comentan para no mostrar botones sin función. Para reactivarlos,
             descomentar cada botón cuando exista su funcionalidad real. -->
        <!--
        <button type="button" class="icon-btn" aria-label="Buscar">...</button>
        <button type="button" class="icon-btn" aria-label="Mi cuenta">...</button>
        <button type="button" class="icon-btn" aria-label="Carrito">...</button>
        -->

    </div>

      <a href="index.html">Inicio</a>
      <a href="productos.html" aria-current="page">Productos</a>
      <a href="mi-mundo.html">Mi Mundo</a>

  <main>
    <section class="page-header">

      <p>Piezas originales <strong>inspiradas</strong> en la cultura alternativa, el rock, el estilo retro y el mundo

      <div class="filtros">

        <button class="filtro" type="button" data-filtro="ropa">Ropa</button>
        <button class="filtro" type="button" data-filtro="accesorios">Accesorios</button>
        <button class="filtro" type="button" data-filtro="gamer">Gamer</button>
        <button class="filtro" type="button" data-filtro="novedades">Novedades</button>

    <section class="productos">
      <div class="products-grid" data-api-productos data-precio>
        <noscript><p>Activa JavaScript para ver los productos.</p></noscript>
      </div>
    </section>

  <footer>
